<script>/* ===== Password gate (Rost 24.10): data.enc.json расшифровывается паролем; ключ помнится в localStorage до «Выйти» ===== */
const Gate = (() => {

  const b2u = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
  const u2b = u => btoa(String.fromCharCode(...new Uint8Array(u)));

    const pt = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: b2u(enc.iv) }, key, b2u(enc.ct));

  async function derive(pw, enc) {
    const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveKey']);
    return crypto.subtle.deriveKey({ name: 'PBKDF2', hash: 'SHA-256', salt: b2u(enc.salt), iterations: enc.iter }, base, { name: 'AES-GCM', length: 256 }, true, ['decrypt']);
  }
  const imp = raw => crypto.subtle.importKey('raw', b2u(raw), 'AES-GCM', true, ['decrypt']);
  function css() {
    const s = document.createElement('style');
    s.textContent = `
.gate-blur .wrap{filter:blur(14px);pointer-events:none;user-select:none}
#gate{position:fixed;inset:0;z-index:9999;display:flex;align-items:center;justify-content:center;background:rgba(15,23,42,.35);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);font-family:Inter,system-ui,-apple-system,sans-serif}
#gate form{background:#fff;color:#0f172a;border-radius:20px;padding:28px 26px 22px;width:min(360px,calc(100vw - 32px));box-shadow:0 24px 60px rgba(15,23,42,.25);text-align:center}
#gate .lg{width:48px;height:48px;border-radius:14px;margin:0 auto 12px;display:flex;align-items:center;justify-content:center;font-size:22px;background:#eef2ff}
#gate h2{margin:0 0 4px;font-size:19px}#gate p{margin:0 0 16px;color:#64748b;font-size:13px}
#gate .row{position:relative}
#gate input{width:100%;box-sizing:border-box;padding:12px 44px 12px 14px;border:1.5px solid #cbd5e1;border-radius:12px;font-size:16px;outline:none}
#gate input:focus{border-color:#6366f1;box-shadow:0 0 0 3px rgba(99,102,241,.15)}
#gate input.masked{-webkit-text-security:disc;text-security:disc}
#gate .eye{position:absolute;right:8px;top:50%;transform:translateY(-50%);border:0;background:none;font-size:18px;cursor:pointer;padding:4px}
#gate button.go{margin-top:12px;width:100%;padding:12px;border:0;border-radius:12px;background:#4f46e5;color:#fff;font-size:15px;font-weight:600;cursor:pointer}
#gate button.go:disabled{opacity:.6}
#gate .err{color:#dc2626;font-size:13px;min-height:18px;margin-top:8px}
#gate .hint{color:#94a3b8;font-size:12px;margin-top:6px}
#gate form.shake{animation:gsh .35s}@keyframes gsh{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
#gate-out{position:fixed;right:14px;bottom:14px;z-index:50;border:1px solid #e2e8f0;background:#fff;color:#64748b;border-radius:999px;padding:6px 12px;font-size:12px;cursor:pointer;box-shadow:0 2px 8px rgba(15,23,42,.08)}
#gate-out:hover{color:#0f172a}`;
    document.head.appendChild(s);
  }
  function logoutBtn() {
    const b = document.createElement('button');
    b.id = 'gate-out'; b.textContent = '🔒 Выйти'; b.title = 'Забыть пароль на этом устройстве';
    b.onclick = () => { try { localStorage.removeItem(LS); } catch (e) {} location.reload(); };
    document.body.appendChild(b);
  }
  function prompt(enc) {
    return new Promise(res => {
      document.body.classList.add('gate-blur');
      const g = document.createElement('div'); g.id = 'gate';
      g.innerHTML = `<form autocomplete="on"><div class="lg">🔒</div><h2>${window.DASH_TITLE || 'Бизнес-дашборд'}</h2><p>Введите пароль, чтобы открыть</p>
<input type="text" name="username" value="rost" autocomplete="username" hidden>
<div class="row"><input id="gate-pw" class="masked" type="text" lang="ru" inputmode="text" autocomplete="current-password" autocapitalize="off" autocorrect="off" spellcheck="false" enterkeyhint="go" placeholder="Пароль" autofocus><button type="button" class="eye" title="Показать пароль">👁</button></div>
<button class="go" type="submit">Открыть</button><div class="err"></div>
<div class="hint">Один раз ввёл — на этом устройстве больше не спрашиваем (до «Выйти»).</div></form>`;
      document.body.appendChild(g);
      const f = g.querySelector('form'), i = g.querySelector('#gate-pw'), err = g.querySelector('.err'), go = g.querySelector('.go');
      g.querySelector('.eye').onclick = () => { i.classList.toggle('masked'); i.focus(); };
      setTimeout(() => i.focus(), 50);
      f.onsubmit = async e => {
        e.preventDefault(); if (!i.value) return;
        go.disabled = true; go.textContent = 'Проверяю…'; err.textContent = '';
        try {
          const key = await derive(i.value.trim().normalize('NFC').toLowerCase(), enc);
          const data = await decrypt(enc, key);
          try { localStorage.setItem(LS, u2b(await crypto.subtle.exportKey('raw', key))); } catch (e2) {}
          g.remove(); document.body.classList.remove('gate-blur'); res(data);
        } catch (e1) {
          err.textContent = 'Неверный пароль'; f.classList.remove('shake'); void f.offsetWidth; f.classList.add('shake');
          go.disabled = false; go.textContent = 'Открыть'; i.select();
        }
      };
    });
  }
  async function unlock(src) {
    css();
    const r = await fetch(src, { cache: 'no-store' });
    if (!r.ok) throw new Error(src + ': HTTP ' + r.status);
    const enc = await r.json();
    let data = null;
    try { const raw = localStorage.getItem(LS); if (raw) data = await decrypt(enc, await imp(raw)); } catch (e) { try { localStorage.removeItem(LS); } catch (e2) {} }
    if (!data) data = await prompt(enc);
    logoutBtn();
    return data;
  }
  return { unlock };
})();
</script>
<script>
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const LBL=c=>{const k=/Telegram/.test(c)?'tg':/UKR/.test(c)?'wu':/ESP/.test(c)?'we':/Viber/.test(c)?'vb':/mail/i.test(c)?'em':'';return `<span class="mlabel ml-${k}">${esc(c)}</span>`};
const T=[['msg','💬 Мессенджеры','#22a06b'],['asst','🧑‍💼 Ассистенты','#5b8cff'],['bots','🤖 Боты','#7c5cff']];
let D,cur=(location.hash.slice(1)||'msg');
function tabs(){const n=document.getElementById('tabs');
 const red=D.bots.reduce((a,b)=>a+b.qs.filter(q=>q.st==='red'&&!q.answered).length,0);
 const pend=D.messengers.reduce((a,g)=>a+g.rows.filter(r=>r.pending||r.unread_chat).length,0);
 const badge={msg:pend,asst:D.bots.reduce((a,b)=>a+b.qs.filter(q=>!q.answered).length,0),bots:red};
 n.innerHTML=T.map(([id,l,c])=>`<button style="--c:${c}" class="${id===cur?'on':''}" onclick="go('${id}')">${l}${badge[id]?`<span class="abadge">${badge[id]}</span>`:''}</button>`).join('')}
function go(id){cur=id;history.replaceState(null,'','#'+id);tabs();render()}
function bindHtml(b){if(!b)return '<span class="nob">нет binding</span>';
 const u=t=>D.cu_base+t;let h=`<div class="bind">🔗 ${b.kind==='девушка'?'личная карточка':'работа'}: `;
 if(b.card)h+=`<a target="_blank" href="${u(b.card[0])}">${esc(b.card[1])}</a> `;
 if(b.tasks)h+=b.tasks.map(t=>`<a target="_blank" href="${u(t[0])}">${esc(t[1])}</a>`).join(' · ');
 return h+'</div>'}
function msg(){return `<div class="grid g2e">`+D.messengers.map(g=>{
 const rows=g.rows.filter(r=>!r.planned||true);
 const total=rows.reduce((a,r)=>a+(r.unread_chat||0),0);
 return `<div class="card"><h3>${esc(g.sphere)}<span class="st">${rows.length} отпр.</span></h3>`+rows.map(r=>{
  const kinds=Object.entries(r.kinds||{}).map(([k,v])=>`${esc(k)} ×${v}`).join(', ');
  return `<details class="mrow"><summary>${LBL(r.channel)}<b>${esc(r.sender)}</b>${r.chat!==r.sender?`<span class="note">в «${esc(r.chat)}»</span>`:''}${r.pending&&!r.planned?'<span class="pill p-high">ждёт</span>':''}${r.planned?'<span class="pill p-normal">план</span>':''}<span class="cnt ${r.unread_chat?'':'z'}">${r.unread_chat??'—'}</span></summary>
  <div class="mbody"><ul>${r.pending?`<li>⏳ ${esc(r.pending)}</li>`:''}${r.client?`<li>Клиент: ${esc(r.client)}</li>`:''}${r.watcher?`<li>${r.watcher_st==='red'?'🔴':'🟢'} Вочер: ${esc(r.watcher)}</li>`:''}${r.unread_list?`<li>Непрочитанные чаты: ${r.unread_list.map(u=>`${esc(u.chat)}${u.kind?` (${esc(u.kind)})`:''} ×${u.n}`).join(', ')||'нет'}</li>`:''}${r.items?`<li>Записей в логе: ${r.items} (${kinds}) · последн. ${esc(r.last||'')} Bogotá</li>`:''}<li>Непрочитано в чате: ${r.unread_chat??'нет данных'} · источник: ${esc(r.src)}</li></ul>${r.planned?'':bindHtml(r.binding)}</div></details>`}).join('')+`</div>`}).join('')+`</div><p class="note">Содержимое сообщений не отображается. Метаданные: secretary-log (25–26.10) по allowlist чатов/людей из contacts; Viber — watcher ещё не запущен.</p>`}
function asst(){return `<div class="grid g2e">`+D.bots.map(b=>`<div class="card"><h3>${esc(b.name)}<span class="st">${b.qs.filter(q=>!q.answered).length} откр.</span></h3>${b.qs.length?`<table><tr><th>Вопрос</th><th>Статус</th></tr>`+b.qs.map(q=>`<tr><td style="white-space:normal">${esc(q.q)}</td><td><span class="pill ${q.answered?'st-ans':'st-open'}">${q.answered?'отвечен':'открыт'}</span></td></tr>`).join('')+`</table>`:'<div class="empty">Нет открытых вопросов (данные не собраны — шаблон)</div>'}</div>`).join('')+`</div>`}
function qa(b,q,i){const href=b.link||'#';const tip=`${b.name}: ${q.q}\nКонтекст: ${q.ctx||''}`;
 return `<a class="q ${q.st}" href="${esc(href)}" title="${esc(tip)}" data-b="${esc(b.name)}" data-i="${i}" onclick="return openQ(this)">${q.st==='green'&&q.new?'<span class="ydot" title="есть новые отчёты"></span>':''}<span>${q.st==='red'?'🔴 ':''}${esc(q.q)}${q.answered?' <span class="pill st-ans">отвечен</span>':''}</span></a>`}
function openQ(a){const b=D.bots.find(x=>x.name===a.dataset.b),q=b.qs[+a.dataset.i];
 const txt=`[Из дашборда] ${q.q}\nКонтекст: ${q.ctx||''}`;try{navigator.clipboard.writeText(txt)}catch(e){}
 const c=document.getElementById('ctx');c.textContent=(b.link?'Открываю чат «'+b.name+'». ':'Это текущий чат (ссылки нет). ')+'Контекст скопирован — вставь в чат.';c.style.display='block';setTimeout(()=>c.style.display='none',3500);
 return !!b.link}
function bots(){return `<div class="grid g2e">`+D.bots.map(b=>{const red=b.qs.map((q,i)=>[q,i]).filter(([q])=>q.st==='red'),gr=b.qs.map((q,i)=>[q,i]).filter(([q])=>q.st!=='red');
 const anyNew=gr.some(([q])=>q.new);
 return `<div class="card ${red.length?'person at':''}"><h3>${esc(b.name)} ${b.link?`<a class="st" href="${esc(b.link)}" title="Открыть чат бота">открыть чат ↗</a>`:''}</h3>
 ${red.map(([q,i])=>qa(b,q,i)).join('')}
 ${gr.length?`<details class="okfold" ${red.length?'':''}><summary>${anyNew?'<span class="ydot"></span> ':''}🟢 Всё ок (${gr.length})</summary>${gr.map(([q,i])=>qa(b,q,i)).join('')}</details>`:''}
 ${!b.qs.length?'<div class="empty">🟢 Вопросов нет (шаблон — данные ещё не собраны)</div>':''}</div>`}).join('')+`</div>
 <p class="note">🔴 застряло/заблокировано · 🟢 норм (свёрнуто) · 🟡 точка = есть новые отчёты. Клик по вопросу копирует контекст в буфер и открывает чат бота по <code>grokbot://app/v1/agent?id=…</code> (<b>формат не подтверждён</b> в app-ui.md — проверить в приложении).</p>`}
function render(){document.getElementById('main').innerHTML=cur==='asst'?asst():cur==='bots'?bots():msg()}
(async()=>{D=await Gate.unlock('data-test-ma.enc.json');document.getElementById('gen').textContent='Данные: '+D.generated+' · TEST';tabs();render()})().catch(e=>{document.getElementById('main').innerHTML='<div class="attn">'+esc(e.message)+'</div>'});
</script></body></html>
