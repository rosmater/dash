<script>/* ===== Password gate (Rost 24.10): data.enc.json расшифровывается паролем; ключ помнится в localStorage до «Выйти» ===== */
const Gate = (() => {
  const LS = window.DASH_LS || 'dash_key_v1';
  const b2u = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
  const u2b = u => btoa(String.fromCharCode(...new Uint8Array(u)));
  async function decrypt(enc, key) {
    const pt = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: b2u(enc.iv) }, key, b2u(enc.ct));
    return JSON.parse(new TextDecoder().decode(pt));
  }
  async function derive(pw, enc) {
    const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveKey']);
    return crypto.subtle.deriveKey({ name: 'PBKDF2', hash: 'SHA-256', salt: b2u(enc.salt), iterations: enc.iter }, base, { name: 'AES-GCM', length: 256 }, true, ['decrypt']);
  }
  const imp = raw => crypto.subtle.importKey('raw', b2u(raw), 'AES-GCM', true, ['decrypt']);
  function css() {
    const s = document.createElement('style');
    s.textContent = `
.gate-blur .wrap{filter:blur(14px);pointer-events:none;user-select:none}
#gate{position:fixed;inset:0;z-index:9999;display:flex;align-items:center;justify-content:center;background:rgba(15,23,42,.35);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);font-family:Inter,system-ui,-apple-system,sans-serif}
#gate form{background:#fff;color:#0f172a;border-radius:20px;padding:28px 26px 22px;width:min(360px,calc(100vw - 32px));box-shadow:0 24px 60px rgba(15,23,42,.25);text-align:center}
#gate .lg{width:48px;height:48px;border-radius:14px;margin:0 auto 12px;display:flex;align-items:center;justify-content:center;font-size:22px;background:#eef2ff}
#gate h2{margin:0 0 4px;font-size:19px}#gate p{margin:0 0 16px;color:#64748b;font-size:13px}
#gate .row{position:relative}
#gate input{width:100%;box-sizing:border-box;padding:12px 44px 12px 14px;border:1.5px solid #cbd5e1;border-radius:12px;font-size:16px;outline:none}
#gate input:focus{border-color:#6366f1;box-shadow:0 0 0 3px rgba(99,102,241,.15)}
#gate input.masked{-webkit-text-security:disc;text-security:disc}
#gate .eye{position:absolute;right:8px;top:50%;transform:translateY(-50%);border:0;background:none;font-size:18px;cursor:pointer;padding:4px}
#gate button.go{margin-top:12px;width:100%;padding:12px;border:0;border-radius:12px;background:#4f46e5;color:#fff;font-size:15px;font-weight:600;cursor:pointer}
#gate button.go:disabled{opacity:.6}
#gate .err{color:#dc2626;font-size:13px;min-height:18px;margin-top:8px}
#gate .hint{color:#94a3b8;font-size:12px;margin-top:6px}
#gate form.shake{animation:gsh .35s}@keyframes gsh{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
#gate-out{position:fixed;right:14px;bottom:14px;z-index:50;border:1px solid #e2e8f0;background:#fff;color:#64748b;border-radius:999px;padding:6px 12px;font-size:12px;cursor:pointer;box-shadow:0 2px 8px rgba(15,23,42,.08)}
#gate-out:hover{color:#0f172a}`;
    document.head.appendChild(s);
  }
  function logoutBtn() {
    const b = document.createElement('button');
    b.id = 'gate-out'; b.textContent = '🔒 Выйти'; b.title = 'Забыть пароль на этом устройстве';
    b.onclick = () => { try { localStorage.removeItem(LS); } catch (e) {} location.reload(); };
    document.body.appendChild(b);
  }
  function prompt(enc) {
    return new Promise(res => {
      document.body.classList.add('gate-blur');
      const g = document.createElement('div'); g.id = 'gate';
      g.innerHTML = `<form autocomplete="on"><div class="lg">🔒</div><h2>${window.DASH_TITLE || 'Бизнес-дашборд'}</h2><p>Введите пароль, чтобы открыть</p>
<input type="text" name="username" value="rost" autocomplete="username" hidden>
<div class="row"><input id="gate-pw" class="masked" type="text" lang="ru" inputmode="text" autocomplete="current-password" autocapitalize="off" autocorrect="off" spellcheck="false" enterkeyhint="go" placeholder="Пароль" autofocus><button type="button" class="eye" title="Показать пароль">👁</button></div>
<button class="go" type="submit">Открыть</button><div class="err"></div>
<div class="hint">Один раз ввёл — на этом устройстве больше не спрашиваем (до «Выйти»).</div></form>`;
      document.body.appendChild(g);
      const f = g.querySelector('form'), i = g.querySelector('#gate-pw'), err = g.querySelector('.err'), go = g.querySelector('.go');
      g.querySelector('.eye').onclick = () => { i.classList.toggle('masked'); i.focus(); };
      setTimeout(() => i.focus(), 50);
      f.onsubmit = async e => {
        e.preventDefault(); if (!i.value) return;
        go.disabled = true; go.textContent = 'Проверяю…'; err.textContent = '';
        try {
          const key = await derive(i.value.trim().normalize('NFC').toLowerCase(), enc);
          const data = await decrypt(enc, key);
          try { localStorage.setItem(LS, u2b(await crypto.subtle.exportKey('raw', key))); } catch (e2) {}
          g.remove(); document.body.classList.remove('gate-blur'); res(data);
        } catch (e1) {
          err.textContent = 'Неверный пароль'; f.classList.remove('shake'); void f.offsetWidth; f.classList.add('shake');
          go.disabled = false; go.textContent = 'Открыть'; i.select();
        }
      };
    });
  }
  async function unlock(src) {
    css();
    const r = await fetch(src, { cache: 'no-store' });
    if (!r.ok) throw new Error(src + ': HTTP ' + r.status);
    const enc = await r.json();
    let data = null;
    try { const raw = localStorage.getItem(LS); if (raw) data = await decrypt(enc, await imp(raw)); } catch (e) { try { localStorage.removeItem(LS); } catch (e2) {} }
    if (!data) data = await prompt(enc);
    logoutBtn();
    return data;
  }
  return { unlock };
})();

/* ===== Dash core (shared by all variants; inlined at build) ===== */
const Dash = (() => {
  let D = null;
  const S = { mode: 'week', week: null, month: null, cur: 'USD', tab: 'overview' }; // Rost 25.10: всё в USD по курсу, переключателя валют нет
  const qs = new URLSearchParams(location.search);
  async function load() {
    if (window.DASH_DATA) { D = window.DASH_DATA; }
    else {
      const src = qs.get('data');
      if (src) { // локальная отладка: ?data=data.json (плоский файл в репо не пушится)
        const r = await fetch(src, { cache: 'no-store' });
        if (!r.ok) throw new Error(src + ': HTTP ' + r.status);
        D = await r.json();
      } else D = await Gate.unlock(window.DASH_ENC || 'data.enc.json');
    }
    // По умолчанию — ТЕКУЩАЯ неделя/месяц по дате браузера (Rost 24.10), а не зашитая неделя.
    const t = new Date(), today = new Date(t - t.getTimezoneOffset() * 6e4).toISOString().slice(0, 10);
    const W = D.meta.weeks, M = D.meta.months;
    const curW = W.find(w => w.start <= today && today <= w.end) || [...W].reverse().find(w => w.start <= today) || W[W.length - 1];
    const curM = M.find(m => m.id === today.slice(0, 7)) || [...M].reverse().find(m => m.id <= today.slice(0, 7)) || M[M.length - 1];
    S.week = qs.get('week') || curW.id;
    S.month = qs.get('month') || curM.id;
    S.mode = qs.get('mode') || 'week';
    S.tab = qs.get('tab') || 'overview';
    // Из localStorage восстанавливаем только вкладку и валюту; период всегда открывается текущий.
    try { const saved = JSON.parse(localStorage.getItem('dash_state') || '{}'); if (!qs.get('tab') && saved.tab) S.tab = saved.tab; } catch (e) {}
    if (S.tab !== 'overview' && !D.directions.some(d => d.id === S.tab)) S.tab = 'overview';
    return D;
  }
  const save = () => { try { localStorage.setItem('dash_state', JSON.stringify(S)); } catch (e) {} };
  const toUSD = cur => { const fx = D.meta.fx; return { USD: 1, COP: 1 / fx.USD_COP.rate, EUR: fx.EUR_USD.rate, UAH: 1 / fx.USD_UAH.rate }[cur]; };
  const conv = (a, from, to) => (a == null ? null : a * toUSD(from) / toUSD(to));
  const curOf = dir => (S.cur === 'native' ? dir.currency : S.cur);
  const pid = () => (S.mode === 'week' ? S.week : S.month);
  const key = (mode, id) => (mode === 'week' ? 'W:' : 'M:') + id;
  const weeksOfMonth = m => D.meta.weeks.filter(w => w.month === m);

  function sumItems(items, cur) {
    let s = 0, any = false;
    for (const it of items || []) { if (it.amount == null) continue; s += conv(it.amount, it.cur, cur); any = true; }
    return any ? s : null;
  }
  // Returns the record for a direction & period. Months: explicit record, or roll-up of weeks (+ extra month items).
  function record(dir, mode, id) {
    if (!dir.periods) return null;
    if (mode === 'week') { const r = dir.periods[key('week', id)]; return r ? { ...r, source: 'week' } : null; }
    const ex = dir.periods[key('month', id)];
    if (ex && !ex.rollup) return { ...ex, source: 'explicit' };
    const ws = weeksOfMonth(id).map(w => dir.periods['W:' + w.start]).filter(Boolean);
    if (!ws.length && !ex) return null;
    const inc = [], exp = [], notes = []; let partial = false; const metrics = {};
    ws.forEach(w => { inc.push(...(w.income || [])); exp.push(...(w.expenses || [])); if (w.status === 'partial') partial = true; });
    if (ex) { inc.push(...(ex.income || [])); exp.push(...(ex.expenses || [])); if (ex.note) notes.push(ex.note); Object.assign(metrics, ex.metrics || {}); }
    const today = new Date().toISOString().slice(0, 10);
    const allW = weeksOfMonth(id).filter(w => w.start <= today);
    if (ws.length < allW.length) partial = true;
    return { income: inc, expenses: exp, metrics, status: partial ? 'partial' : 'full', note: notes.join(' '), source: 'rollup', weeks: ws.length, weeksTotal: allW.length };
  }
  function summary(dir, mode = S.mode, id = pid(), cur = curOf(dir)) {
    const r = record(dir, mode, id);
    if (!r) return { has: false, cur };
    const income = sumItems(r.income, cur), expenses = sumItems(r.expenses, cur);
    const profit = income == null ? null : income - (expenses || 0);
    const roi = income != null && expenses ? profit / expenses * 100 : null;
    const unknownInc = (r.income || []).some(i => i.amount == null);
    const has = income != null || expenses != null || Object.keys(r.metrics || {}).length > 0 || unknownInc;
    return { has, cur, income, expenses, profit, roi, expensesKnown: expenses != null, rec: r, status: r.status, unknownInc };
  }
  function periods(mode = S.mode) {
    const list = mode === 'week' ? D.meta.weeks : D.meta.months;
    return list.map(p => ({ id: p.id, label: p.label, iso: p.iso }));
  }
  function periodLabel(mode = S.mode, id = pid()) { const p = periods(mode).find(x => x.id === id); return p ? p.label : id; }
  function series(dir, mode = S.mode, cur = curOf(dir), opts = {}) {
    let ps = periods(mode);
    if (opts.onlyData) ps = ps.filter(p => summary(dir, mode, p.id, cur).has);
    if (opts.last) ps = ps.slice(-opts.last);
    const s = ps.map(p => summary(dir, mode, p.id, cur));
    return { labels: ps.map(p => p.label), ids: ps.map(p => p.id), income: s.map(x => x.income ?? null), expenses: s.map(x => x.expenses ?? null), profit: s.map(x => x.profit ?? null) };
  }
  function goals(dir, mode = S.mode, id = pid()) {
    return (dir.goals || []).filter(g => (g.period_type || 'week') === mode).map(g => {
      let actual = g.by_period ? g.by_period[key(mode, id)] : undefined;
      if (actual === undefined && g.auto_month === 'income' && mode === 'month') { const s = summary(dir, 'month', id, dir.currency); actual = s.income ?? undefined; }
      const has = actual !== undefined && actual !== null;
      let pct = null;
      if (has) pct = g.lower_is_better ? (actual <= g.target ? 100 : Math.max(0, 100 - (actual - g.target) / Math.max(g.target, 1) * 100)) : (g.target ? actual / g.target * 100 : null);
      return { ...g, actual: has ? actual : null, pct };
    });
  }
  function breakdowns(dir, mode = S.mode, id = pid()) {
    return (dir.breakdowns || []).filter(b => b.period == null || b.period === key(mode, id));
  }
  function overview(mode = S.mode, id = pid(), cur = S.cur === 'native' ? 'USD' : S.cur) {
    const rows = D.directions.filter(d => !d.kind && !d.no_overview_totals).map(d => ({ dir: d, s: summary(d, mode, id, cur) }));
    const tot = { income: 0, expenses: 0, profit: 0, n: 0 };
    rows.forEach(r => { if (r.s.income != null) { tot.income += r.s.income; tot.profit += r.s.profit; tot.n++; } if (r.s.expenses != null) tot.expenses += r.s.expenses; });
    return { rows, tot, cur };
  }
  const SYM = { USD: '$', EUR: '€', COP: 'COP', UAH: '₴' };
  function fmt(v, cur, compact) {
    if (v == null || Number.isNaN(v)) return '—';
    const a = Math.abs(v); let s;
    if (compact && a >= 1e6) s = (v / 1e6).toLocaleString('ru-RU', { maximumFractionDigits: a >= 1e8 ? 0 : 1 }) + ' млн';
    else if (compact && a >= 1e4) s = (v / 1e3).toLocaleString('ru-RU', { maximumFractionDigits: 1 }) + ' тыс';
    else s = v.toLocaleString('ru-RU', { maximumFractionDigits: (cur === 'COP' || cur === 'UAH' || a >= 1000) ? 0 : 2 });
    if (!cur) return s;
    return cur === 'USD' || cur === 'EUR' ? SYM[cur] + s : s + ' ' + SYM[cur];
  }
  const num = v => (typeof v === 'number' ? v.toLocaleString('ru-RU', { maximumFractionDigits: 2 }) : (v ?? '—'));
  const pct = v => (v == null ? '—' : (v > 0 ? '+' : '') + v.toFixed(0) + '%');
  const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  function fxFooter() { return ''; // Rost 25.10: футер с курсами/версией/правилами не показываем, конвертация в USD остаётся
  }
  function fxFooterOld() {
    const f = D.meta.fx;
    return `Курсы: 1 USD = ${f.USD_COP.rate.toLocaleString('ru-RU')} COP — ${esc(f.USD_COP.source)}, ${f.USD_COP.date} · 1 EUR = ${f.EUR_USD.rate} USD (${esc(f.EUR_USD.source)}, ${f.EUR_USD.date}) · 1 USD = ${f.USD_UAH.rate} UAH (${esc(f.USD_UAH.source)}). ` +
      `Данные: data.json v${esc(D.meta.version)}, собрано ${esc(D.meta.generated_at)} (Богота). ${esc(D.meta.week_to_month_rule)}. Значок «пример» = не реальная цифра.`;
  }
  const EX = '<span class="ex-badge" title="Не реальная цифра — пример">пример</span>';
  const PRI = { urgent: 'срочно', high: 'высокий', normal: 'обычный', low: 'низкий' };
  function trend(dir, mode = S.mode, id = pid(), cur = curOf(dir)) {
    const ps = periods(mode); const i = ps.findIndex(p => p.id === id);
    if (i <= 0) return null;
    const a = summary(dir, mode, id, cur), b = summary(dir, mode, ps[i - 1].id, cur);
    if (a.profit == null || b.profit == null || !b.profit) return null;
    return (a.profit - b.profit) / Math.abs(b.profit) * 100;
  }
  // Weekly breakdown of a month + total row (total = month record: roll-up or explicit)
  function rollup(dir, monthId, cur = curOf(dir)) {
    const ws = weeksOfMonth(monthId).map(w => ({ w, s: summary(dir, 'week', w.id, cur) }));
    const total = summary(dir, 'month', monthId, cur);
    return { weeks: ws, total, explicit: total.rec && total.rec.source === 'explicit' };
  }
  return { rollup, load, S, save, get D() { return D; }, conv, curOf, pid, record, summary, series, goals, breakdowns, overview, periods, periodLabel, fmt, num, pct, esc, fxFooter, EX, PRI, trend, weeksOfMonth };
})();
</script>

 document.querySelectorAll('canvas.sp').forEach(c=>spark(c,JSON.parse(c.dataset.d),c.dataset.c));
 charts.push(new Chart($('#main-ch'),{data:{labels:ser.labels,datasets:[{type:'bar',label:'Доход',data:ser.income,backgroundColor:'#22c59bcc',borderRadius:6},{type:'bar',label:'Расходы',data:ser.expenses,backgroundColor:'#ff5d7acc',borderRadius:6},{type:'line',label:'Прибыль',data:ser.profit,borderColor:d.color,backgroundColor:d.color,tension:.35,borderWidth:3,spanGaps:true}]},options:{maintainAspectRatio:false,plugins:{legend:{position:'bottom',labels:{boxWidth:10}},tooltip:{callbacks:{label:c=>c.dataset.label+': '+fmt(c.raw,cur)}}},scales:{x:{grid:{display:false}},y:{ticks:{callback:v=>fmt(v,null,true)}}}}}));}
function rollupHTML(d,cur){const r=Dash.rollup(d,S.month,cur);const row=(l,x,b)=>`<tr${b?' style="font-weight:700"':''}><td>${l}</td><td class="n">${x.has?fmt(x.income,cur):'—'}</td><td class="n">${x.expensesKnown?fmt(x.expenses,cur):'—'}</td><td class="n">${x.has?fmt(x.profit,cur):'—'}</td><td class="n">${x.has?(x.status==='partial'?'частично':'полная'):'нет данных'}</td></tr>`;
 return `<div class="tblwrap"><table><tr><th>Неделя</th><th class="n">Доход</th><th class="n">Расходы</th><th class="n">Прибыль</th><th class="n">Статус</th></tr>${r.weeks.map(x=>row(x.w.iso+' · '+x.w.label,x.s)).join('')}${row(r.explicit?'Итог месяца (из источника)':'Итог месяца = сумма недель'+(r.total.rec&&r.total.rec.note?' + доп. статьи':''),r.total,true)}</table></div>`}
function goalsHTML(d){const gs=Dash.goals(d);if(!gs.length)return `<div class="empty">Целей для режима «${S.mode==='week'?'неделя':'месяц'}» нет — переключите период</div>`;
 return gs.map(g=>`<div class="goal" style="--c:${d.color}"><div class="row"><span>${esc(g.label)}</span><b>${g.actual==null?'—':Dash.num(g.actual)} / ${Dash.num(g.target)} ${esc(g.unit)}${g.example?EX:''}</b></div><div class="bar"><i style="width:${Math.min(100,g.pct||0)}%;${g.pct!=null&&g.pct<50?'background:linear-gradient(90deg,#ff5d7a,#ffb547)':''}"></i></div><small>${g.actual==null?'факт: нет данных · ':''}${esc(g.src||'')}</small></div>`).join('')}

/* ===== Attention («требует внимания») — only from real data.json fields ===== */
const TODAY=(()=>{const t=new Date();return new Date(t-t.getTimezoneOffset()*6e4).toISOString().slice(0,10)})();
const DONE=/complete|closed|done|выполн|закрыт/i,BLOCK=/block|блок|stuck|wait|жд[её]м/i;
function attn(d){const it=[];
 (d.tasks||[]).forEach(t=>{const st=String(t.status||'');if(DONE.test(st))return;const over=t.due&&t.due<TODAY;let why=null;
  if(t.priority==='urgent')why='срочно'+(over?' · просрочено':'');else if(BLOCK.test(st))why='заблокировано';else if(t.priority==='high'&&over)why='высокий · просрочено';
  if(why)it.push({grp:t.list||'Задачи',text:t.name,url:t.url,why,cls:''})});
 (d.people||[]).forEach(p=>{if(p.status==='attention')(p.items||[]).filter(x=>/^\s*Я:/.test(x)).forEach(x=>it.push({grp:(p.icon?p.icon+' ':'')+p.name,text:x,why:'внимание',cls:''}))}); // Rost 25.10: в счёт идут только пункты «Я:»
 (d.gaps||[]).forEach(g=>it.push({grp:'Пробелы в данных',text:g,why:'пробел',cls:'gap'}));
 if(d.kind!=='people'){const s=Dash.summary(d);if(s.has&&s.status==='partial')it.push({grp:'Период',text:'«'+Dash.periodLabel()+'» не закрыт — данные частичные',why:'частично',cls:'gap'})}
 return it}
function attnAll(){const D=Dash.D;const own=attn({tasks:D.overview.tasks});const per=D.directions.map(d=>({d,it:attn(d)}));return {own,per,n:own.length+per.reduce((a,x)=>a+x.it.length,0)}}
function linesHTML(it,max=5){const grp={};it.forEach(x=>(grp[x.grp]=grp[x.grp]||[]).push(x));let out=[],i=0;
 const ln=x=>`<div class="ln"><span class="why ${x.cls}">${esc(x.why)}</span>${x.url?`<a href="${x.url}" target="_blank" rel="noopener">${esc(x.text)}</a>`:`<span>${esc(x.text)}</span>`}</div>`;
 const vis=[],hid=[];Object.entries(grp).forEach(([g,xs])=>xs.forEach((x,j)=>{const h=(j===0?`<div class="grp">${esc(g)}</div>`:'')+ln(x);(i++<max?vis:hid).push(h)}));
 return vis.join('')+(hid.length?`<details><summary>ещё ${hid.length}</summary>${hid.join('')}</details>`:'')}
function attnHTML(d){const it=attn(d);if(!it.length)return '';
 const nt=it.filter(x=>x.cls!=='gap').length;
 return `<div class="attn"><h4>🔴 Требует внимания · ${it.length}</h4>${linesHTML(it.filter(x=>x.cls!=='gap').concat(it.filter(x=>x.cls==='gap')),nt>5?nt:5)}</div>`}
function attnOverviewHTML(){const a=attnAll();if(!a.n)return '';
 const rows=a.per.filter(x=>x.it.length).map(({d,it})=>{const t=it.filter(x=>x.cls!=='gap').length,g=it.length-t;
  return `<div class="ln go" data-t="${d.id}"><span class="why">${it.length}</span><span><b>${d.icon} ${esc(d.name)}</b> — ${[t?t+' задач/вопросов':'',g?g+' пробел(ов)/частично':''].filter(Boolean).join(', ')} →</span></div>`}).join('');
 return `<div class="attn"><h4>🔴 Требует внимания · ${a.n}</h4>${rows}${a.own.length?linesHTML(a.own):''}</div>`}
function metricsHTML(p){const m=p.metrics;if(!m&&!p.goal)return '';
 const num=v=>v==null||v===''?null:+v,fmt=(v,u)=>v==null?'—':(u==='$'?'$':'')+v.toLocaleString('ru-RU')+(u&&u!=='$'?' '+u:'');
 const rows=(m&&m.groups||[]).flatMap(g=>g.rows),plat=rows.filter(r=>r.platform).map(r=>num(r.value)),platSum=plat.some(v=>v!=null)?plat.reduce((a,v)=>a+(v||0),0):null;
 const tv=r=>r.total?platSum:num(r.value),pct=m&&m.target&&platSum!=null?Math.min(100,platSum/m.target*100):0;
 let h=`<div class="mx">${p.goal?`<div class="goal">🎯 ${esc(p.goal)}</div>`:''}`;
 if(m){if(m.target)h+=`<div class="note" style="display:flex;justify-content:space-between"><span>${esc(m.target_label||'Цель')}</span><b>${fmt(platSum,'$')} / $${m.target.toLocaleString('ru-RU')}</b></div><div class="bar"><i style="width:${pct}%"></i></div>`;
  h+=m.groups.map(g=>`<h5>${esc(g.title)}</h5><table>${g.rows.map(r=>`<tr class="${r.total?'tot':''} ${r.excluded?'ex':''}"><td>${r.url?`<a href="${esc(r.url)}" target="_blank" rel="noopener" style="color:inherit">${esc(r.label)} ↗</a>`:esc(r.label)}${r.hint||r.measured?`<span class="hint">${esc([r.hint,r.measured?'замер '+r.measured:''].filter(Boolean).join(' · '))}</span>`:''}</td><td class="v">${fmt(tv(r),r.unit)}</td></tr>`).join('')}</table>`).join('');
  if(m.note)h+=`<div class="note" style="font-size:11px;margin-top:6px">${esc(m.note)}</div>`}
 return h+'</div>'}
const STAGE_T={money:'есть деньги',launched:'запустились, денег пока нет',starting:'стартуем'};
function stageDot(d){return d.stage?`<span class="sdot ${d.stage}" title="${STAGE_T[d.stage]||''}"></span>`:''}
function stageLegend(){return `<div class="slegend">${Object.keys(STAGE_T).map(k=>`<span><span class="sdot ${k}"></span>${STAGE_T[k]}</span>`).join('')}</div>`}
// Я: всегда выше Он:/Она:; подпункты «— …» остаются под своим родителем
function meFirst(items){const g=[];items.forEach(x=>{if(/^\s*—/.test(x)&&g.length)g[g.length-1].push(x);else g.push([x])});const me=x=>/^Я:/.test(x[0]);return g.filter(me).concat(g.filter(x=>!me(x))).flat()}
function people(d){const ps=d.people||[];
 let h=`<div class="card" style="margin-bottom:14px;border-color:#bfe6f555;background:linear-gradient(135deg,#ecf8fd,var(--panel))"><div style="font-size:22px;font-weight:800">${d.icon} ${esc(d.name)}</div><div class="note">${esc(d.subtitle)} · ${ps.length} чел. · требуют внимания: ${ps.filter(p=>p.status==='attention').length}</div></div>`;
 const pc=p=>{const at=p.status==='attention';return `<div class="card person ${at?'at':''}"><div style="display:flex;justify-content:space-between;gap:8px;align-items:center"><div><div style="font-weight:700;font-size:16px">${p.icon||'👤'} ${esc(p.name)}</div><div class="note">${esc(p.role||'')}</div></div><span class="chip ${at?'st-at':'st-ok'}">${at?'🔴 требует внимания':'🟢 ок'}</span></div>
 ${!p.metrics&&p.goal?metricsHTML(p):''}${p.items&&p.items.length?`<ul>${meFirst(p.items).map(x=>`<li>${esc(x)}</li>`).join('')}</ul>`:''}${p.metrics?metricsHTML(p):''}${p.cu?[].concat(p.cu).map(c=>`<div style="margin-top:8px"><a href="${c.url}" target="_blank" rel="noopener" style="font-size:13px;color:var(--acc);text-decoration:none">🔗 ${esc(c.label)}</a> <span class="st">${esc(c.status||'')}</span></div>`).join(''):''}${p.note?`<p class="note" style="margin:8px 0 0">${esc(p.note)}</p>`:''}${p.src?`<div class="note" style="font-size:11px;margin-top:6px">источник: ${esc(p.src)}</div>`:''}</div>`};
 h+=`<div class="grid g2e"><div class="pcol">${ps.slice(0,1).map(pc).join('')}</div><div class="pcol">${ps.slice(1).map(pc).join('')}</div></div>`;
 if((d.tasks||[]).length)h+=`<div style="height:14px"></div><div class="card"><h3>Задачи ClickUp</h3>${tasksHTML(d.tasks)}</div>`;
 $('#main').innerHTML=h}
const BOG='America/Bogota';const bDay=iso=>iso.length===10?iso:new Intl.DateTimeFormat('en-CA',{timeZone:BOG,year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date(iso));
const bTime=iso=>new Date(iso).toLocaleTimeString('ru-RU',{timeZone:BOG,hour:'2-digit',minute:'2-digit'});
let calSrc='all',calDay=null;
const calAdd=(k,n)=>{const t=new Date(k+'T12:00:00Z');t.setUTCDate(t.getUTCDate()+n);return t.toISOString().slice(0,10)};
function calendar(d){const ev=(d.events||[]).filter(e=>!e.all_day),now=new Date(),today=bDay(now.toISOString()),tmr=calAdd(today,1);
 if(!calDay)calDay=today;const k=calDay,PX=46,d0=new Date(k+'T00:00:00-05:00').getTime(),d1=d0+864e5;
 const fit=e=>calSrc==='all'||e.src===calSrc||(calSrc==='clickup'&&(e.cu||[]).length);
 const xs=ev.filter(fit).map(e=>{const s=new Date(e.start).getTime(),en=e.end?new Date(e.end).getTime():s+30*6e4;return{e,s,en}}).filter(o=>o.en>d0&&o.s<d1).sort((a,b)=>a.s-b.s||b.en-a.en);
 const lanes=[];xs.forEach(o=>{let i=lanes.findIndex(t=>t<=o.s);if(i<0){i=lanes.length;lanes.push(0)}lanes[i]=o.en;o.l=i});
 xs.forEach(o=>{o.n=Math.max(1,...xs.filter(p=>p.s<o.en&&p.en>o.s).map(p=>p.l+1))});
 const nG=ev.filter(e=>e.src==='gcal').length,nC=ev.filter(e=>e.src==='clickup').length+ev.reduce((a,e)=>a+(e.cu||[]).length,0);
 const WD=new Intl.DateTimeFormat('ru-RU',{timeZone:'UTC',weekday:'long',day:'numeric',month:'long'});
 const bt=(on,a,l)=>`<button data-nav="${a}" class="${on?'on':''}">${l}</button>`;
 let h=`<div class="card" style="margin-bottom:14px;background:linear-gradient(135deg,#e8f0fe,var(--panel));border-color:#c6dafc"><div style="display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:center"><div><div style="font-size:22px;font-weight:800">${d.icon} ${esc(d.name)}</div><div class="note">${esc(d.subtitle)} · снимок GCal ${esc(d.gcal_fetched_at||'—')} · ClickUp ${esc(d.cu_fetched_at||'—')}</div></div>
 <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap"><div class="seg calf">${[['all','Все'],['gcal','Google ('+nG+')'],['clickup','ClickUp ('+nC+')']].map(([s,l])=>`<button data-s="${s}" class="${calSrc===s?'on':''}">${l}</button>`).join('')}</div>${d.gcal_url?`<a class="chip" href="${d.gcal_url}" target="_blank" rel="noopener" style="text-decoration:none">Google Календарь ↗</a>`:''}</div></div>
 <div class="calnav"><div class="seg">${bt(0,-1,'‹')}${bt(k===today,'today','Сегодня')}${bt(k===tmr,'tmr','Завтра')}${bt(0,1,'›')}</div><input type="date" id="calpick" value="${k}"><b style="font-size:15px;text-transform:capitalize">${esc(WD.format(new Date(k+'T12:00:00Z')))}</b>${k===today?'<span class="chip" style="background:#4285f4;color:#fff;border-color:#4285f4">Сегодня</span>':''}</div>
 <div class="slegend"><span><span class="src gcal">Google</span> событие</span><span><span class="src clickup">ClickUp</span> задача со временем</span><span><span class="culink">🔗 ClickUp</span> карточка, привязанная к событию (справа)</span></div></div>`;
 h+=`<div class="card tl-wrap"><div class="tl" id="tl" style="height:${24*PX}px">`;
 for(let i=0;i<24;i++)h+=`<div class="tl-h" style="top:${i*PX}px"><span>${String(i).padStart(2,'0')}:00</span></div>`;
 xs.forEach(({e,s,en,l,n})=>{const top=Math.max(0,(s-d0)/36e5*PX),bot=Math.min(24*PX,(en-d0)/36e5*PX),ht=Math.max(22,bot-top);
  const past=en<now,cur=s<=now&&now<en,tm=e.due?'до '+bTime(e.start):(s<d0?'…':bTime(e.start))+'–'+(en>d1?'…':bTime(e.end));
  const t=e.url?`<a href="${e.url}" target="_blank" rel="noopener">${esc(e.title)}</a>`:esc(e.title);
  const cu=(e.cu||[]).map(c=>`<a class="culink" href="${c.url}" target="_blank" rel="noopener" title="${esc((c.list||'')+' · до '+bTime(c.due))}">🔗 ${esc(c.title)}</a>`).join('');
  h+=`<div class="tl-ev ${e.src} ${past?'past':''} ${cur?'now':''}" style="top:${top}px;height:${ht}px;left:calc(56px + (100% - 60px)*${l}/${n});width:calc((100% - 60px)/${n} - 4px)"><div class="tl-main"><span class="tm">${tm}</span> ${t}${e.list?` <span class="ls">· ${esc(e.list)}</span>`:''}</div>${cu?`<div class="tl-cu">${cu}</div>`:''}</div>`});
 if(k===today){const y=(now-d0)/36e5*PX;h+=`<div class="tl-now" style="top:${y}px"></div>`}
 h+=`</div>${xs.length?'':`<div class="empty" style="padding:14px">На этот день событий со временем нет в снимке.</div>`}</div>`;
 $('#main').innerHTML=h;
 document.querySelectorAll('.calf button').forEach(b=>b.onclick=()=>{calSrc=b.dataset.s;calendar(d)});
 document.querySelectorAll('[data-nav]').forEach(b=>b.onclick=()=>{const a=b.dataset.nav;calDay=a==='today'?today:a==='tmr'?tmr:calAdd(calDay,+a);calendar(d)});
 const pk=$('#calpick');pk.onchange=()=>{if(pk.value){calDay=pk.value;calendar(d)}};
 const sc=k===today?Math.max(0,(now-d0)/36e5*PX-120):7*PX;requestAnimationFrame(()=>{const w=document.querySelector('.tl-wrap');if(w)w.scrollTop=sc})}
function render(){kill();Dash.save();controls();const d=Dash.D.directions.find(x=>x.id===S.tab);d?(d.kind==='people'?people(d):d.kind==='calendar'?calendar(d):direction(d)):overview();$('#foot').textContent=Dash.fxFooter();}
Dash.load().then(()=>document.fonts.ready).then(render).catch(e=>{$('#main').innerHTML='<div class="card">Не удалось загрузить data.json: '+esc(e.message)+'</div>'});
</script></body></html>
