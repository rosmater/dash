const Dash = (() => {
  let D = null;
  const S = { mode: 'today', mv: 2, week: null, month: null, cur: 'USD', tab: 'overview' }; // Rost 25.10: всё в USD по курсу, переключателя валют нет
  const qs = new URLSearchParams(location.search);
  async function load() {
    if (window.DASH_DATA) { D = window.DASH_DATA; }
    else {
      const src = qs.get('data');
      if (src) { // локальная отладка: ?data=data.json (плоский файл в репо не пушится)
        const r = await fetch(src, { cache: 'no-store' });

      } else D = await Gate.unlock(window.DASH_ENC || 'data.enc.json');
    }

    const t = new Date(), today = new Date(t - t.getTimezoneOffset() * 6e4).toISOString().slice(0, 10);
    const W = D.meta.weeks, M = D.meta.months;
    const curW = W.find(w => w.start <= today && today <= w.end) || [...W].reverse().find(w => w.start <= today) || W[W.length - 1];
    const curM = M.find(m => m.id === today.slice(0, 7)) || [...M].reverse().find(m => m.id <= today.slice(0, 7)) || M[M.length - 1];
    S.week = qs.get('week') || curW.id;
    S.month = qs.get('month') || curM.id;
    S.mode = qs.get('mode') || 'today'; // Rost 25.10: по умолчанию «Сегодня» (рабочий экран); неделя/месяц — сводка
    S.tab = qs.get('tab') || 'overview';
    // Из localStorage восстанавливаем только вкладку и валюту; период всегда открывается текущий.
    try { const saved = JSON.parse(localStorage.getItem('dash_state') || '{}'); if (!qs.get('tab') && saved.tab) S.tab = saved.tab; if (!qs.get('mode') && saved.mv === 2 && ['today','week','month'].includes(saved.mode)) S.mode = saved.mode; } catch (e) {}
    if (S.tab !== 'overview' && !D.directions.some(d => d.id === S.tab)) S.tab = 'overview';
    return D;
  }
  const save = () => { try { localStorage.setItem('dash_state', JSON.stringify(S)); } catch (e) {} };
  const toUSD = cur => { const fx = D.meta.fx; return { USD: 1, COP: 1 / fx.USD_COP.rate, EUR: fx.EUR_USD.rate, UAH: 1 / fx.USD_UAH.rate }[cur]; };
  const conv = (a, from, to) => (a == null ? null : a * toUSD(from) / toUSD(to));
  const curOf = dir => (S.cur === 'native' ? dir.currency : S.cur);
  const pid = () => (S.mode === 'month' ? S.month : S.week); // today → текущая неделя для фоновых расчётов
  const key = (mode, id) => (mode !== 'month' ? 'W:' : 'M:') + id;
  const weeksOfMonth = m => D.meta.weeks.filter(w => w.month === m);

  function sumItems(items, cur) {
    let s = 0, any = false;
    for (const it of items || []) { if (it.amount == null) continue; s += conv(it.amount, it.cur, cur); any = true; }
    return any ? s : null;
  }
  // Returns the record for a direction & period. Months: explicit record, or roll-up of weeks (+ extra month items).
  function record(dir, mode, id) {
    if (mode === 'today') mode = 'week';
    if (!dir.periods) return null;
    if (mode === 'week') { const r = dir.periods[key('week', id)]; return r ? { ...r, source: 'week' } : null; }
    const ex = dir.periods[key('month', id)];
    if (ex && !ex.rollup) return { ...ex, source: 'explicit' };
    const ws = weeksOfMonth(id).map(w => dir.periods['W:' + w.start]).filter(Boolean);
    if (!ws.length && !ex) return null;
    const inc = [], exp = [], notes = []; let partial = false; const metrics = {};
    ws.forEach(w => { inc.push(...(w.income || [])); exp.push(...(w.expenses || [])); if (w.status === 'partial') partial = true; });
    if (ex) { inc.push(...(ex.income || [])); exp.push(...(ex.expenses || [])); if (ex.note) notes.push(ex.note); Object.assign(metrics, ex.metrics || {}); }
    const today = new Date().toISOString().slice(0, 10);
    const allW = weeksOfMonth(id).filter(w => w.start <= today);
    if (ws.length < allW.length) partial = true;
    return { income: inc, expenses: exp, metrics, status: partial ? 'partial' : 'full', note: notes.join(' '), source: 'rollup', weeks: ws.length, weeksTotal: allW.length };
  }
  function summary(dir, mode = S.mode, id = pid(), cur = curOf(dir)) {
    const r = record(dir, mode, id);
    if (!r) return { has: false, cur };
    const income = sumItems(r.income, cur), expenses = sumItems(r.expenses, cur);
    const profit = income == null ? null : income - (expenses || 0);
    const roi = income != null && expenses ? profit / expenses * 100 : null;
    const unknownInc = (r.income || []).some(i => i.amount == null);
    const has = income != null || expenses != null || Object.keys(r.metrics || {}).length > 0 || unknownInc;
    return { has, cur, income, expenses, profit, roi, expensesKnown: expenses != null, rec: r, status: r.status, unknownInc };
  }
  function periods(mode = S.mode) {
    if (mode === 'today') mode = 'week';
    const list = mode === 'week' ? D.meta.weeks : D.meta.months;

  }
  function periodLabel(mode = S.mode, id = pid()) { const p = periods(mode).find(x => x.id === id); return p ? p.label : id; }

    let ps = periods(mode);

  }
  function goals(dir, mode = S.mode, id = pid()) {
    if (mode === 'today') mode = 'week';
    return (dir.goals || []).filter(g => (g.period_type || 'week') === mode).map(g => {
      let actual = g.by_period ? g.by_period[key(mode, id)] : undefined;

      const has = actual !== undefined && actual !== null;
      let pct = null;
      if (has) pct = g.lower_is_better ? (actual <= g.target ? 100 : Math.max(0, 100 - (actual - g.target) / Math.max(g.target, 1) * 100)) : (g.target ? actual / g.target * 100 : null);
      return { ...g, actual: has ? actual : null, pct };

  }
  function breakdowns(dir, mode = S.mode, id = pid()) {
    return (dir.breakdowns || []).filter(b => b.period == null || b.period === key(mode, id));
  }
  function overview(mode = S.mode, id = pid(), cur = S.cur === 'native' ? 'USD' : S.cur) {
    const rows = D.directions.filter(d => !d.kind && !d.no_overview_totals).map(d => ({ dir: d, s: summary(d, mode, id, cur) }));
    const tot = { income: 0, expenses: 0, profit: 0, n: 0 };
    rows.forEach(r => { if (r.s.income != null) { tot.income += r.s.income; tot.profit += r.s.profit; tot.n++; } if (r.s.expenses != null) tot.expenses += r.s.expenses; });
    return { rows, tot, cur };
  }
  const SYM = { USD: '$', EUR: '€', COP: 'COP', UAH: '₴' };
  function fmt(v, cur, compact) {
    if (v == null || Number.isNaN(v)) return '—';
    const a = Math.abs(v); let s;
    if (compact && a >= 1e6) s = (v / 1e6).toLocaleString('ru-RU', { maximumFractionDigits: a >= 1e8 ? 0 : 1 }) + ' млн';
    else if (compact && a >= 1e4) s = (v / 1e3).toLocaleString('ru-RU', { maximumFractionDigits: 1 }) + ' тыс';
    else s = v.toLocaleString('ru-RU', { maximumFractionDigits: (cur === 'COP' || cur === 'UAH' || a >= 1000) ? 0 : 2 });
    if (!cur) return s;
    return cur === 'USD' || cur === 'EUR' ? SYM[cur] + s : s + ' ' + SYM[cur];
  }
  const num = v => (typeof v === 'number' ? v.toLocaleString('ru-RU', { maximumFractionDigits: 2 }) : (v ?? '—'));
  const pct = v => (v == null ? '—' : (v > 0 ? '+' : '') + v.toFixed(0) + '%');
  const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  function fxFooter() { return ''; // Rost 25.10: футер с курсами/версией/правилами не показываем, конвертация в USD остаётся
  }
  function fxFooterOld() {
    const f = D.meta.fx;
    return `Курсы: 1 USD = ${f.USD_COP.rate.toLocaleString('ru-RU')} COP — ${esc(f.USD_COP.source)}, ${f.USD_COP.date} · 1 EUR = ${f.EUR_USD.rate} USD (${esc(f.EUR_USD.source)}, ${f.EUR_USD.date}) · 1 USD = ${f.USD_UAH.rate} UAH (${esc(f.USD_UAH.source)}). ` +
      `Данные: data.json v${esc(D.meta.version)}, собрано ${esc(D.meta.generated_at)} (Богота). ${esc(D.meta.week_to_month_rule)}. Значок «пример» = не реальная цифра.`;
  }
  const EX = '<span class="ex-badge" title="Не реальная цифра — пример">пример</span>';
  const PRI = { urgent: 'срочно', high: 'высокий', normal: 'обычный', low: 'низкий' };
  function trend(dir, mode = S.mode, id = pid(), cur = curOf(dir)) {
    const ps = periods(mode); const i = ps.findIndex(p => p.id === id);
    if (i <= 0) return null;
    const a = summary(dir, mode, id, cur), b = summary(dir, mode, ps[i - 1].id, cur);
    if (a.profit == null || b.profit == null || !b.profit) return null;
    return (a.profit - b.profit) / Math.abs(b.profit) * 100;
  }
  // Weekly breakdown of a month + total row (total = month record: roll-up or explicit)
  function rollup(dir, monthId, cur = curOf(dir)) {

    const total = summary(dir, 'month', monthId, cur);

})();

const TODAY=(()=>{const t=new Date();return new Date(t-t.getTimezoneOffset()*6e4).toISOString().slice(0,10)})();
const DONE=/complete|closed|done|выполн|закрыт/i,BLOCK=/block|блок|stuck|wait|жд[её]м/i;
function attn(d){const it=[];
 if(d.id==='defense'){(d.unanswered_replies||(d.board&&d.board.unanswered_replies)||[]).forEach(r=>{const who=r.company||r.from||'компания';const subj=r.subject||'ответ';it.push({grp:'Ответы без ответа',text:who+' — '+subj+(r.note?': '+r.note:''),url:r.url||null,why:'ответ',cls:''})});return it}
 (d.tasks||[]).forEach(t=>{const st=String(t.status||'');if(DONE.test(st))return;const over=t.due&&t.due<TODAY;let why=null;
  if(t.priority==='urgent')why='срочно'+(over?' · просрочено':'');else if(BLOCK.test(st))why='заблокировано';else if(t.priority==='high'&&over)why='высокий · просрочено';
  if(why)it.push({grp:t.list||'Задачи',text:t.name,url:t.url,why,cls:''})});
 (d.people||[]).forEach(p=>{if(p.status==='attention')(p.items||[]).filter(x=>/^\s*Я:/.test(x)).forEach(x=>it.push({grp:(p.icon?p.icon+' ':'')+p.name,text:x,why:'внимание',cls:''}))}); // Rost 25.10: в счёт идут только пункты «Я:»
 (d.gaps||[]).forEach(g=>it.push({grp:'Пробелы в данных',text:g,why:'пробел',cls:'gap'}));
 if(d.board){const b=boardSt(d.board);if(!b.ok)it.push({grp:'Рассылка',text:b.why,why:'рассылка',cls:''})} // Rost 25.10: Оборонка — внимание, если вчера не было рассылки
 if(d.kind!=='people'&&S.mode!=='today'){const s=Dash.summary(d);if(s.has&&s.status==='partial')it.push({grp:'Период',text:'«'+Dash.periodLabel()+'» не закрыт — данные частичные',why:'частично',cls:'gap'})}
 return it}

 const vis=[],hid=[];Object.entries(grp).forEach(([g,xs])=>xs.forEach((x,j)=>{const h=(j===0?`<div class="grp">${esc(g)}</div>`:'')+ln(x);(i++<max?vis:hid).push(h)}));
 return vis.join('')+(hid.length?`<details><summary>ещё ${hid.length}</summary>${hid.join('')}</details>`:'')}

 const rows=a.per.filter(x=>x.it.length).map(({d,it})=>{const t=it.filter(x=>x.cls!=='gap').length,g=it.length-t;
  return `<div class="ln go" data-t="${d.id}"><span class="why">${it.length}</span><span><b>${d.icon} ${esc(d.name)}</b> — ${[t?t+' задач/вопросов':'',g?g+' пробел(ов)/частично':''].filter(Boolean).join(', ')} →</span></div>`}).join('');
 return `<div class="attn"><h4>🔴 Требует внимания · ${a.n}</h4>${rows}${a.own.length?linesHTML(a.own):''}</div>`}
function metricsHTML(p){const m=p.metrics;if(!m&&!p.goal)return '';
 const num=v=>v==null||v===''?null:+v,fmt=(v,u)=>v==null?'—':(u==='$'?'$':'')+v.toLocaleString('ru-RU')+(u&&u!=='$'?' '+u:'');
 const rows=(m&&m.groups||[]).flatMap(g=>g.rows),plat=rows.filter(r=>r.platform).map(r=>num(r.value)),platSum=plat.some(v=>v!=null)?plat.reduce((a,v)=>a+(v||0),0):null;
 const tv=r=>r.total?platSum:num(r.value),pct=m&&m.target&&platSum!=null?Math.min(100,platSum/m.target*100):0;

  if(m.note)h+=`<div class="note" style="font-size:11px;margin-top:6px">${esc(m.note)}</div>`}

function boardSt(b){const today=bDay(new Date().toISOString()),y=calAdd(today,-1),n=(b.sent_by_day||{})[y]||0,snap=(b.snapshot_at||'').slice(0,10);

 ${tile('💬 Ответили',Dash.num(b.replies),`${b.replies_companies&&b.replies_companies.length?esc(b.replies_companies.join(', ')):'пока никто'}${b.auto_replies?` · +${b.auto_replies} автоответ(а) не считаем`:''}`,'#7c5cff')}</div>`;

function tlHTML(evs,k,o={}){const PX=46,now=Date.now(),d0=new Date(k+'T00:00:00-05:00').getTime(),d1=d0+864e5,cuOnly=!!o.cuOnly,src=o.src||'all';
 const inDay=x=>x.en>d0&&x.s<d1,srt=(a,b)=>a.s-b.s||b.en-a.en;

 // ClickUp: свои события + карточки, привязанные к событиям Google (e.cu) — все в правую колонку на своё время

 tlLanes(G);{const lanes=[];C.forEach(x=>{let i=lanes.findIndex(t=>t<=x.s);if(i<0){i=lanes.length;lanes.push(0)}lanes[i]=x.lv;x.l=i});C.forEach(x=>{x.n=Math.max(1,...C.filter(p=>p.s<x.lv&&p.lv>x.s).map(p=>p.l+1))})}
 const AX=58,L=cuOnly?'0px':'(100% - '+AX+'px)*0.55',R=cuOnly?'(100% - '+AX+'px)':'(100% - '+AX+'px)*0.45';
 const y=t=>Math.max(0,Math.min(24*PX,(t-d0)/36e5*PX));
 let h=`<div class="tl2-head" style="padding-left:${AX}px">${cuOnly?'':`<div style="width:calc(${L})"><span class="src gcal">Google</span> календарь</div>`}<div style="width:calc(${R})"><span class="src clickup">ClickUp</span> задачи со временем</div></div>`;
 h+=`<div class="card tl-wrap" ${o.h?`style="max-height:${o.h}"`:''}><div class="tl tl2" style="height:${24*PX}px">`;
 for(let i=0;i<24;i++)h+=`<div class="tl-h" style="top:${i*PX}px"><span>${String(i).padStart(2,'0')}:00</span></div>`;
 if(!cuOnly)h+=`<div class="tl-split" style="left:calc(${AX}px + ${L})"></div>`;
 G.forEach(({e,s,en,l,n})=>{const top=y(s),ht=Math.max(22,y(en)-top),past=en<now,cur=s<=now&&now<en,tm=(s<d0?'…':bTime(e.start))+'–'+(en>d1?'…':bTime(e.end));
  const t=e.url?`<a href="${e.url}" target="_blank" rel="noopener">${esc(e.title)}</a>`:esc(e.title);
  h+=`<div class="tl-ev gcal ${past?'past':''} ${cur?'now':''}" style="top:${top}px;height:${ht}px;left:calc(${AX}px + ${L}*${l}/${n});width:calc(${L}/${n} - 4px)"><div class="tl-main"><span class="tm">${tm}</span> ${t}${(e.cu||[]).length?` <span class="ls" title="есть задача ClickUp на это время (справа)">🔗${e.cu.length}</span>`:''}</div></div>`});
 C.forEach(({c,s,en,l,n})=>{const top=y(s),span=en>s,ht=span?Math.max(22,y(en)-top):22,past=(span?en:s)<now,cur=span&&s<=now&&now<en;
  const tm=span?bTime(c.start)+'–'+bTime(c.end):(c.due?'до ':'')+bTime(c.start);
  const t=c.url?`<a href="${c.url}" target="_blank" rel="noopener">${esc(c.title)}</a>`:esc(c.title);
  // метка ClickUp прямо у шкалы времени + пунктир через колонку Google до задачи
  h+=`<div class="tl-cumark" style="top:${top}px" title="${esc(tm+' · '+c.title)}"></div>`;
  if(!cuOnly)h+=`<div class="tl-guide" style="top:${top}px;width:calc(${L})"></div>`;
  h+=`<div class="tl-ev clickup tl-cu2 ${past?'past':''} ${cur?'now':''}" style="top:${top-(span?0:11)}px;height:${ht}px;left:calc(${AX}px + ${cuOnly?'0px':L} + ${R}*${l}/${n} + 4px);width:calc(${R}/${n} - 6px)" title="${esc((c.list||'')+(c.ev?' · к событию «'+c.ev+'»':''))}"><div class="tl-main"><span class="tm">${tm}</span> ${t}${c.list?` <span class="ls">· ${esc(c.list)}</span>`:''}</div></div>`});
 const today=bDay(new Date().toISOString());if(k===today)h+=`<div class="tl-now" style="top:${y(now)}px"></div>`;
 h+=`</div>${G.length||C.length?'':`<div class="empty" style="padding:14px">${o.empty||'На этот день событий со временем нет в снимке.'}</div>`}</div>`;
 return {h,nG:G.length,nC:C.length,sc:k===today?Math.max(0,y(now)-120):7*PX}}
function tlScroll(sc){requestAnimationFrame(()=>document.querySelectorAll('.tl-wrap').forEach(w=>w.scrollTop=sc))}
function calendar(d){const ev=(d.events||[]).filter(e=>!e.all_day),today=bDay(new Date().toISOString()),tmr=calAdd(today,1);

 <div class="calnav"><div class="seg">${bt(0,-1,'‹')}${bt(k===today,'today','Сегодня')}${bt(k===tmr,'tmr','Завтра')}${bt(0,1,'›')}</div><input type="date" id="calpick" value="${k}"><b style="font-size:15px;text-transform:capitalize">${esc(WD.format(new Date(k+'T12:00:00Z')))}</b>${k===today?'<span class="chip" style="background:#4285f4;color:#fff;border-color:#4285f4">Сегодня</span>':''}</div>
 <div class="slegend">${d.cu_only?'':'<span><span class="src gcal">Google</span> слева — события</span>'}<span><span class="src clickup">ClickUp</span> ${d.cu_only?'':'справа — '}задачи со временем, на своём часе</span><span><span class="tl-cumark lg"></span> метка у шкалы = есть задача ClickUp на это время</span></div></div>`;
 const t=tlHTML(ev,k,{cuOnly:d.cu_only,src:calSrc});h+=t.h;
 $('#main').innerHTML=h;
 document.querySelectorAll('.calf button').forEach(b=>b.onclick=()=>{calSrc=b.dataset.s;calendar(d)});
 document.querySelectorAll('[data-nav]').forEach(b=>b.onclick=()=>{const a=b.dataset.nav;calDay=a==='today'?today:a==='tmr'?tmr:calAdd(calDay,+a);calendar(d)});

 tlScroll(t.sc)}
/* ===== Режим «Сегодня» (Rost 25.10): рабочий экран; неделя/месяц — только сводка ===== */
const calDir=()=>Dash.D.directions.find(x=>x.kind==='calendar');
const tIdOf=u=>{const m=/[?&]t=([^&#]+)/.exec(u||'');return m?m[1]:null};
function listOwner(){const D=Dash.D,cnt={};D.directions.forEach(d=>(d.tasks||[]).forEach(t=>{if(!t.list)return;(cnt[t.list]=cnt[t.list]||{})[d.id]=(cnt[t.list][d.id]||0)+1}));
 const o={};Object.entries(cnt).forEach(([l,c])=>{o[l]=Object.entries(c).sort((a,b)=>b[1]-a[1])[0][0]});return o}
function evDirs(e){const D=Dash.D,lo=listOwner(),out=new Set();
 const byId=id=>D.directions.forEach(d=>(d.tasks||[]).forEach(t=>{if(t.id===id)out.add(d.id)}));
 [e,...(e.cu||[])].forEach(x=>{const id=tIdOf(x.url);if(id)byId(id);if(x.list&&lo[x.list])out.add(lo[x.list])});return out}
function todayEvents(dirId){const c=calDir();if(!c)return [];const today=bDay(new Date().toISOString()),d0=new Date(today+'T00:00:00-05:00').getTime(),d1=d0+864e5;
 return (c.events||[]).filter(e=>!e.all_day).map(e=>{const s=new Date(e.start).getTime(),en=e.end?new Date(e.end).getTime():s+30*6e4;return{e,s,en}}).filter(o=>o.en>d0&&o.s<d1&&(!dirId||evDirs(o.e).has(dirId))).sort((a,b)=>a.s-b.s)}
function agendaHTML(xs,empty){if(!xs.length)return `<div class="empty">${empty}</div>`;const now=Date.now();
 return xs.map(({e,s,en})=>{const tm=e.due?'до '+bTime(e.start):bTime(e.start)+(e.end?'–'+bTime(e.end):'');const t=e.url?`<a href="${e.url}" target="_blank" rel="noopener">${esc(e.title)}</a>`:esc(e.title);
  const cu=(e.cu||[]).map(c=>` <a class="culink" href="${c.url}" target="_blank" rel="noopener">🔗 ${esc(c.title)}</a>`).join('');
  return `<div class="ag ${en<now?'past':''} ${s<=now&&now<en?'now':''}"><span class="tm">${tm}</span><span class="src ${e.src}">${e.src==='gcal'?'Google':'ClickUp'}</span><span style="flex:1">${t}${e.list?` <span class="st">${esc(e.list)}</span>`:''}${cu}</span></div>`}).join('')}
const openT=ts=>(ts||[]).filter(t=>!DONE.test(String(t.status||'')));
const dueToday=ts=>openT(ts).filter(t=>t.due===TODAY),overdue=ts=>openT(ts).filter(t=>t.due&&t.due<TODAY).sort((a,b)=>(prioRank[a.priority]-prioRank[b.priority])||String(a.due).localeCompare(b.due));
const toWeek=(l='сводка за неделю →')=>`<button class="tolink" data-tow="1">${l}</button>`;

 document.querySelectorAll('.tdcard,.attn .go').forEach(c=>c.onclick=()=>{S.tab=c.dataset.t;render();scrollTo({top:0,behavior:'smooth'})})}
function overviewToday(){const D=Dash.D,dirs=D.directions.filter(d=>d.kind!=='calendar'),c=calDir(),today=bDay(new Date().toISOString());
 const allT=[...dirs.flatMap(d=>(d.tasks||[]).map(t=>({...t,name:d.icon+' '+t.name}))),...D.overview.tasks];
 // Rost 25.10: главный вид «Общий · Сегодня» = таймлайн дня (слева Google, справа ClickUp со временем)
 const WD=new Intl.DateTimeFormat('ru-RU',{timeZone:'UTC',weekday:'long',day:'numeric',month:'long'});
 const t=c?tlHTML((c.events||[]).filter(e=>!e.all_day),today,{cuOnly:c.cu_only,h:'64vh',empty:'На сегодня событий со временем нет в снимке.'}):null;
 let h=`<div class="card" style="margin-bottom:14px;background:linear-gradient(135deg,#e8f0fe,var(--panel));border-color:#c6dafc"><div class="today-h"><div><div style="font-size:20px;font-weight:800;text-transform:capitalize">📅 ${esc(WD.format(new Date(today+'T12:00:00Z')))}</div><div class="note">${c?(c.cu_only?'Задачи ClickUp со временем':'Слева Google Календарь · справа задачи ClickUp со временем на тех же часах')+(c.cu_only?'':' · снимок GCal '+esc(c.gcal_fetched_at||'—'))+' · ClickUp '+esc(c.cu_fetched_at||'—'):'Календарь скрыт'}</div></div>${c?'<button class="tolink" data-calgo="1">другой день →</button>':''}</div></div>`;

 dirs.forEach(d=>{const a=attn(d).filter(x=>x.cls!=='gap').length,dt=dueToday(d.tasks).length,ov=overdue(d.tasks).length,ev=c?todayEvents(d.id).length:0,me=(d.people||[]).flatMap(p=>(p.items||[]).filter(x=>/^\s*Я:/.test(x))).length;
  h+=`<div class="card tdcard dircard" data-t="${d.id}" style="--glow:${d.color}"><div class="name">${stageDot(d)}${d.icon} ${esc(d.name)}</div><div class="sub">${esc(d.subtitle||'')}</div><div class="cnt">${a?`<span class="chip st-at" style="background:#ffe3e5;color:#b42318">🔴 ${a} внимание</span>`:''}${dt?`<span class="chip">сегодня ${dt}</span>`:''}${ov?`<span class="chip partial">просрочено ${ov}</span>`:''}${ev?`<span class="chip">📅 ${ev}</span>`:''}${me?`<span class="chip">Я: ${me}</span>`:''}${!a&&!dt&&!ov&&!ev&&!me?'<span class="chip full">на сегодня пусто</span>':''}</div></div>`});

/* Пептиды (Rost 25.10): Итого сначала, потом период — Сегодня→за вчера, Неделя→за неделю, Месяц→за месяц. Источник — GSheet PEPTIDOS VENTAS */
function ledgerKPI(L,inR){let n=0,u=0,rev=0,exp=0;(L.sales||[]).forEach(x=>{if(!inR(x.date))return;n++;u+=x.units||0;rev+=x.price||0;exp+=(x.commission||0)+(x.cogs||0)});
 (L.costs||[]).forEach(c=>{if(c.date?inR(c.date):(inR.month&&inR.month(c.month)))exp+=Dash.conv(c.amount||0,c.cur||L.cur,L.cur)});return {n,u,rev,exp,profit:rev-exp}}
function ledgerHTML(d){const L=d.ledger;if(!L)return '';const cur=Dash.curOf(d),f=v=>fmt(Dash.conv(v,L.cur,cur),cur),m=S.mode,today=bDay(new Date().toISOString());
 const all=Object.assign(()=>true,{month:()=>true});let pr,pl;
 if(m==='today'){const y=calAdd(today,-1);pr=Object.assign(x=>x===y,{month:()=>false});pl='За вчера · '+y.slice(8,10)+'.'+y.slice(5,7)}
 else if(m==='week'){const a=Dash.pid(),b=calAdd(a,6);pr=Object.assign(x=>x>=a&&x<=b,{month:()=>false});pl='За неделю · '+Dash.periodLabel()}
 else{const mo=Dash.pid();pr=Object.assign(x=>x.slice(0,7)===mo,{month:x=>x===mo});pl='За месяц · '+Dash.periodLabel()}

 const row=(K,ttl,sub)=>`<h3 style="margin:0 0 8px">${ttl} <span class="st">${esc(sub)}</span></h3><div class="grid g4">${tile('🛒 Продажи',K.n,K.u!==K.n?K.u+' ед. товара':'шт.')}${tile('💰 Деньги',f(K.rev),'выручка')}${tile('💸 Расходы',f(K.exp),'таблица + комиссия + себест. китов')}${tile('📈 Прибыль',f(K.profit),'деньги − расходы',K.profit<0?'neg':'')}</div>`;
 const snap=(L.fetched_at||'').slice(0,10),stale=m==='today'&&snap&&snap<today;
 return `<div class="card" style="margin-bottom:14px">${row(T,'Итого',first?'с '+first.slice(8,10)+'.'+first.slice(5,7)+'.'+first.slice(0,4):'')}<div style="height:14px"></div>${row(P,pl,P.n?'':'продаж нет')}
 <p class="note" style="margin:10px 0 0">Продажи — <a href="https://docs.google.com/spreadsheets/d/1VqMt81ZX1ZoSj4maK1o99xUPaDyqTvvEU1KxTw6kO9M/edit#gid=1025277545" target="_blank" rel="noopener">PEPTIDOS VENTAS ↗</a> · расходы — <a href="https://docs.google.com/spreadsheets/d/1-X24SE_ZfP7mXm9_WUFRwCo-H45ryI9R2yvYpOu-bIE/edit#gid=0" target="_blank" rel="noopener">Expensed Peso Saludable ↗</a> · снимок ${esc(L.fetched_at||'—')}${stale?' <b style="color:#d93025">— снимок не сегодняшний, «вчера» может быть неполным</b>':''}. ${esc(L.note||'')}</p></div>`}
function directionToday(d){const c=calDir(),ev=c?todayEvents(d.id):[],dt=dueToday(d.tasks),ov=overdue(d.tasks),rest=openT(d.tasks).filter(t=>!dt.includes(t)&&!ov.includes(t));
