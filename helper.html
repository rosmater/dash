/* Rost t5962u/t5963u: Табакевич — ряд фин/решения, группа «Отдел ИМ», подблоки розницы, дельты */.tbk-col{display:flex;flex-direction:column;gap:14px;min-width:0}.tbk-col>.card{margin:0}.goals-compact h3{margin-bottom:4px}.goals-compact .goal{padding:5px 0;font-size:12.5px}.goals-compact .goal small{font-size:10.5px}.goals-compact .goal .bar{margin:3px 0}.goals-compact .note{font-size:11px}

/* Rost t5965u: Недвижимость — Монитор Solvia слева, Цель справа, один ряд; на узком — столбиком */.re-row{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;margin-bottom:14px;align-items:stretch}.re-row>.card{margin:0}@media(max-width:720px){.re-row{grid-template-columns:1fr}}/* Rost t5966u: компактная строка ссылок/статуса вместо большой плашки названия вкладки */.tab-head{display:flex;justify-content:flex-end;align-items:center;flex-wrap:wrap;gap:6px 10px;margin:0 0 10px;min-height:0}.tab-head .note{margin:0}/* Rost t5967u: свёрнутая «🔴 Требует внимания · N» уже и ниже (~половина), красный акцент слева сохраняем */.attn{padding:5px 10px;border-radius:10px}.attn h4{margin:0;line-height:1.25}.attn .attnd>summary{display:flex;align-items:center;gap:6px;margin:0;padding:1px 0;color:inherit;font-size:inherit;line-height:1.25}.attn .attnd[open]>summary{margin-bottom:6px}/* Rost t5970u–t5972u: зазоры между блоками вдвое меньше — и горизонталь (карточки в ряд), и вертикаль (друг под другом), в том числе после «🔴 Требует внимания» */#main .grid,#main .g2b,#main .g3b,#main .dlgrow,#main .mcols2,#main .pcol,#main .tbk-row,#main .re-row{gap:7px}#main .mcols{column-gap:7px}#main .attn,#main .tbk-grp,#main .tbk-row,#main .re-row,#main .dlgrow,#main .cal-day,#main .tl-wrap,#main .pin-hi{margin-bottom:7px}#main .tab-head{margin-bottom:5px}#main .mcols2 .card,#main .mcols>.card{margin-bottom:7px}#main>[style*="margin-bottom:14px"],#main [style*="margin-bottom:14px"]{margin-bottom:7px!important}#main [style*="margin-top:14px"]{margin-top:7px!important}#main [style*="margin:14px 0"]{margin-top:7px!important;margin-bottom:5px!important}#main>div[style="height:14px"],#main div[style="height:14px"]{height:7px!important}#main .grid>.card,#main .tbk-row>.card,#main .re-row>.card,#main .dlgrow>.card,#main .g2b>.card,#main .g3b>.card,#main .pcol>.card{margin-bottom:0!important}@media(max-width:520px){#main .g4{gap:5px}}/* Rost t5973u: вдвое меньше вертикальный зазор межд .calweek{display:grid;grid-template-columns:36px 1fr;border:1px solid var(--line);border-radius:12px;background:var(--panel);overflow:auto;max-height:min(70vh,760px);-webkit-overflow-scrolling:touch}

/* t6093u / t6095u / t6166u / t6167u: один жёлтый блок как «Требует внимания», не строка на каждое обновление */
.du-lines.du-attn{background:#fff8dc;border:1px solid #f5d56a;border-left:4px solid #e0a82a;border-radius:10px;padding:5px 10px;margin:0 0 7px;box-shadow:var(--shadow)}

.du-attn .du-ln{display:block;padding:4px 2px;border-bottom:1px solid #f0e2a0;border-radius:0;background:none;font-size:13px;font-weight:400;color:var(--txt);cursor:pointer;line-height:1.4;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.du-chip.nu:hover{filter:brightness(.96)}
.du-chip.ok{background:#e5e7eb;color:#6b7280;cursor:default}
/* t6165u: жёлтый кружок новых данных рядом с красным бейджем направления; на «Общий» — серый другого оттенка, рядом с tbadge */
.dubadge{display:inline-grid;place-items:center;min-width:16px;height:16px;padding:0 4px;margin-left:4px;border-radius:99px;background:#f5c84a;color:#6b4a00;font:700 10px Inter;vertical-align:1px;box-shadow:0 0 0 1px #e0a82a;box-sizing:border-box;line-height:1}

@media(max-width:520px){.dubadge,.dubadge-ov{min-width:14px;height:14px;padding:0 3px;margin-left:3px;font-size:9px}}

/* Rost t6141u: таблицы МП / Glovo вписываются в ширину карточки и на мобиле, без гориз. скролла */
@media(max-width:640px){.tbk-fit th,.tbk-fit td{white-space:normal!important;padding:4px 2px!important;font-size:10.5px!important;width:auto!important;overflow-wrap:anywhere}.tbk-fit .note,.tbk-fit b.note{white-space:normal!important;font-size:10px!important}.tbk-fit table{table-layout:fixed;width:100%}.tbk-fit th:first-child,.tbk-fit td:first-child{width:24%!important}}
/* Rost t6184u: «Оплаты квартирантов» — комментарии только в 1-й колонке, таблица в ширину карточки, без гориз. скролла */
.re-pay{min-width:0}
.re-pay>summary .st{white-space:normal}
.re-pay>.tblwrap{overflow:hidden;max-width:100%}
.re-pay table{table-layout:fixed;width:100%;min-width:0}
.re-pay th,.re-pay td{white-space:normal;overflow-wrap:break-word;word-break:normal;padding:5px 4px;vertical-align:top}

.re-pay th:nth-child(2),.re-pay td:nth-child(2){width:9%}

.re-pay td:last-child{white-space:nowrap}
.re-pay .re-pay-note{display:block;color:var(--mut);font-size:10.5px;line-height:1.35;font-weight:400;white-space:normal;overflow-wrap:anywhere}
.re-pay .re-m{font-size:11px;line-height:1.3;font-variant-numeric:tabular-nums}
/* Rost t6185u: «Из чего сложилось» — по комнатам таблица, Итого под ней; свёрнутая строка как была */
td.fact-hasu{white-space:normal;vertical-align:top;padding:0}
.fact-cols .tblwrap{overflow:hidden;max-width:100%}
.fact-cols table{table-layout:fixed;width:100%;min-width:0}
.fact-cols th:first-child,.fact-cols td:first-child{white-space:normal;overflow-wrap:anywhere}
.fact-cols th.n,.fact-cols td.n{width:32%;white-space:nowrap}
.fact-rooms{margin:0}
.fact-rooms>summary{cursor:pointer;list-style:none;display:flex;align-items:flex-start;gap:6px;padding:7px 6px}
.fact-rooms>summary::-webkit-details-marker,.fact-rooms>summary::marker{display:none;content:none}
.fact-rooms>summary::before{content:"\25B8";color:#94a3b8;font-size:11px;font-weight:700;flex:none;line-height:1;margin-top:3px}

.fact-name{flex:1;min-width:0}
.fact-amt{flex:none;width:32%;text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
.fact-units{margin:0 6px 8px;min-width:0}
.fact-units table{width:100%;table-layout:fixed;min-width:0}
.fact-units th,.fact-units td{white-space:normal;overflow-wrap:anywhere;padding:4px 4px;font-size:11.5px;vertical-align:top}
.fact-units th.n,.fact-units td.n{white-space:nowrap;text-align:right;font-variant-numeric:tabular-nums;width:22%}
.fact-units-tot{margin-top:4px;font-weight:700;font-size:12.5px}
@media(max-width:520px){
  .re-pay th,.re-pay td{padding:4px 2px;font-size:10.5px}
  .re-pay .re-pay-note,.re-pay .note{font-size:9.5px}

  .re-pay th:first-child,.re-pay td:first-child{width:22%}
  .re-pay th:nth-child(2),.re-pay td:nth-child(2){width:10%}
  .re-pay th:last-child,.re-pay td:last-child{width:8%}
  .fact-units th,.fact-units td{padding:3px 2px;font-size:10.5px}
}
/* Rost t6225u: один серый треугольник одного размера у всех сворачиваемых блоков */

.qc-attn{background:#f3f4f6;border:1px solid #d1d5db;border-left:4px solid #9ca3af;border-radius:10px;padding:5px 10px;margin:0 0 7px;box-shadow:var(--shadow)}

.alert-ln,.attn .atit>summary,.attn .ln:not(details),.sc-alert .sc-ln,.qc-item,.pin-hi{display:flex;align-items:center;gap:6px;min-width:0;max-width:100%;white-space:nowrap}

<script>/* ===== Password gate (Rost 24.10): data.enc.json расшифровывается паролем; ключ помнится в localStorage до «Выйти» ===== */

    const tot = { income: 0, expenses: 0, profit: 0, n: 0 };

/* t6093u / t6095u / t6165u / t6166u / t6167u:
   Один блок «🟡 Есть новые данные · N ▾» (как «🔴 Требует внимания · N ▾»):
   свёрнут по умолчанию, раскрывается в список блоков, клик по строке — переход к блоку.
   Не отдельная жёлтая строка на каждое обновление. Скрывается при N=0.
   Чип ✓ у блока; клик помечает просмотренным, N и бейджи вкладок пересчитываются.
   Жёлтый кружок на кнопках направлений; на «Общий» — серый сумматор другого оттенка.
   Первый заход: seen = current, сразу серый чип. Хранилище helper отдельное.
   На helper не считаем блок баланса и скрытые вкладки. */
const DataUpd = (() => {
  const LS = window.DASH_HELPER ? 'dash_data_seen_asst_v1' : 'dash_data_seen_v1';
  const extra = {};
  let booted = false;

  function bogDay(d) {
    return new Intl.DateTimeFormat('en-CA', { timeZone: 'America/Bogota', year: 'numeric', month: '2-digit', day: '2-digit' }).format(d || new Date());
  }
  function bogDDMM(isoOrDate) {
    let s;
    if (typeof isoOrDate === 'string' && /^\d{4}-\d{2}-\d{2}/.test(isoOrDate)) s = isoOrDate.slice(0, 10);
    else s = bogDay(isoOrDate instanceof Date ? isoOrDate : new Date());
    const p = s.split('-');
    return p[2] + '.' + p[1];
  }
  function loadSeen() {
    try { return JSON.parse(localStorage.getItem(LS) || '{}') || {}; } catch (e) { return {}; }
  }
  function saveSeen(m) {
    try { localStorage.setItem(LS, JSON.stringify(m)); } catch (e) {}
  }
  function catalog() {
    const base = ((typeof Dash !== 'undefined' && Dash.D && Dash.D.data_updates) || {}).blocks || [];
    const by = {};
    base.forEach(b => { if (b && b.id) by[b.id] = b; });
    Object.keys(extra).forEach(k => { by[k] = extra[k]; });
    return Object.keys(by).map(k => by[k]);
  }
  function boot() {
    const list = catalog();
    if (!list.length && !Object.keys(extra).length) return;
    const seen = loadSeen();
    let ch = false;
    const today = bogDay();
    list.forEach(b => {
      if (b && b.id && b.ver && !seen[b.id]) {
        seen[b.id] = { ver: b.ver, seen_at: today };
        ch = true;
      }
    });
    if (ch) saveSeen(seen);
    booted = true;
  }
  function stateOf(b) {
    if (!b || !b.ver) return 'ok';
    const s = loadSeen()[b.id];
    if (!s) return 'ok'; // ещё не boot — не жёлтим
    return s.ver === b.ver ? 'ok' : 'nu';
  }
  function isVisible(b) {
    if (!b || !b.id) return false;
    // helper.html не содержит блок баланса — не считаем его и не светим
    if (window.DASH_HELPER && (b.id === 'overview.balance' || b.dir === 'overview')) return false;
    if (b.dir && b.dir !== 'overview') {
      try {
        const dirs = (typeof Dash !== 'undefined' && Dash.D && Dash.D.directions) || [];
        if (dirs.length && !dirs.some(d => d.id === b.dir)) return false;
      } catch (e) {}
    }
    return true;
  }
  function unseen(dir) {
    boot();
    return catalog().filter(b => {
      if (!isVisible(b)) return false;
      if (dir && b.dir !== dir) return false;
      return stateOf(b) === 'nu';
    });
  }
  function tabCount(dir) {
    if (!dir || dir === 'overview') return unseen(null).length;
    return unseen(dir).length;
  }
  function paintTabBadges() {
    const all = tabCount('overview');
    document.querySelectorAll('#tabs button[data-t], #mabtn button[data-t]').forEach(btn => {
      const id = btn.getAttribute('data-t');
      const n = (id === 'overview') ? all : tabCount(id);
      let el = btn.querySelector('.dubadge, .dubadge-ov');
      if (!n) {
        if (el) el.remove();
        return;
      }
      const cls = id === 'overview' ? 'dubadge-ov' : 'dubadge';
      const title = id === 'overview'
        ? ('Новых данных по всем направлениям: ' + n)
        : ('Есть новые данные: ' + n);
      if (el) {
        el.className = cls;
        el.textContent = String(n);
        el.title = title;
      } else {
        el = document.createElement('span');
        el.className = cls;
        el.textContent = String(n);
        el.title = title;
        btn.appendChild(el);
      }
    });
  }
  function markSeen(id) {
    const b = catalog().find(x => x.id === id);
    if (!b) return;
    const seen = loadSeen();
    seen[id] = { ver: b.ver, seen_at: bogDay() };
    saveSeen(seen);
  }
  function tip(b) {
    const st = stateOf(b);
    if (st === 'nu') return 'Есть обновления данных — нажми, если посмотрел';
    const s = loadSeen()[b.id] || {};
    const dd = s.seen_at ? bogDDMM(s.seen_at) : bogDDMM();
    return 'Данные просмотрены ' + dd;
  }
  function chipHTML(b) {
    const st = stateOf(b);
    return `<button type="button" class="du-chip ${st}" data-du-chip="${esc(b.id)}" title="${esc(tip(b))}" aria-label="${esc(tip(b))}">✓</button>`;
  }
  function linesHTML(items, open) {
    if (!items.length) return '';

    ).join('');
    const title = (typeof topChipH === 'function')
      ? topChipH('🟡 Есть новые данные · ' + n, 'Новое · ' + n)
      : `<h4 style="display:inline">🟡 Есть новые данные · ${n}</h4>`;

  }

    try { return (typeof S !== 'undefined' && S.tab) || 'overview'; } catch (e) { return 'overview'; }
  }
  function placeLines() {
    const main = document.getElementById('main');
    if (!main) return;
    const old = main.querySelector('.du-lines');
    let wasOpen = false;
    if (old) {
      const det = old.matches('details') ? old : old.querySelector('details');
      wasOpen = !!(det && det.open);

      if (attn && attn.parentElement && attn.parentElement.classList.contains('top-row')) {

    try { if (typeof alertFit === 'function') alertFit(node); } catch (e) {}
  }
  function slotFor(root) {
    return root.querySelector('.du-slot') || root.querySelector(':scope > h3') || root.querySelector('summary h3') || root.querySelector('h3');
  }
  function headOf(slot) {
    let head = slot.querySelector(':scope > .du-head');
    if (head) return head;
    head = document.createElement('span');
    head.className = 'du-head';
    const stay = n => n.nodeType === 1 && (n.classList.contains('st') || n.classList.contains('bal-lock') || n.classList.contains('du-chip') || n.classList.contains('du-head'));
    const move = [];
    [...slot.childNodes].forEach(n => { if (!stay(n)) move.push(n); });
    move.forEach(n => head.appendChild(n));
    const st = slot.querySelector(':scope > .st');
    const lock = slot.querySelector(':scope > .bal-lock');
    if (st) slot.insertBefore(head, st);
    else if (lock) slot.insertBefore(head, lock);
    else slot.insertBefore(head, slot.firstChild);
    return head;
  }
  function paintChips() {
    document.querySelectorAll('[data-du]').forEach(el => {
      const id = el.getAttribute('data-du');
      const b = catalog().find(x => x.id === id);
      if (!b) return;
      const slot = slotFor(el);
      if (!slot) return;
      const head = headOf(slot);
      const tmp = document.createElement('div');
      tmp.innerHTML = chipHTML(b);
      const node = tmp.firstElementChild;
      const existing = slot.querySelector('.du-chip');
      if (existing) existing.replaceWith(node);
      else head.appendChild(node);
    });
  }
  function bind() {
    document.querySelectorAll('[data-du-go]').forEach(el => {
      const go = ev => { ev.preventDefault(); jump(el.getAttribute('data-du-go')); };
      el.onclick = go;
      el.onkeydown = ev => { if (ev.key === 'Enter' || ev.key === ' ') go(ev); };
    });
    document.querySelectorAll('[data-du-chip]').forEach(el => {
      el.onclick = ev => {
        ev.preventDefault();
        ev.stopPropagation();
        const id = el.getAttribute('data-du-chip');
        const b = catalog().find(x => x.id === id);
        if (!b || stateOf(b) !== 'nu') return;
        markSeen(id);
        afterRender();
      };
    });
  }
  function afterRender() {
    if (typeof Dash === 'undefined' || !Dash.D) return;
    boot();
    placeLines();
    paintChips();
    paintTabBadges();
    bind();
  }
  function jump(id) {
    const b = catalog().find(x => x.id === id);
    if (!b) return;
    try {
      if (b.dir === 'overview' || b.id === 'overview.balance') {
        S.tab = 'overview';
        if (b.id === 'overview.balance') S.oview = 'balance';
      } else {
        S.tab = b.dir;
      }
    } catch (e) {}
    try { render(); } catch (e) {}
    setTimeout(() => {
      const el = document.querySelector('[data-du="' + id + '"]') || document.getElementById(b.anchor || ('du-' + id.replace(/\./g, '-')));
      if (!el) return;
      let p = el;
      while (p) {
        if (p.tagName === 'DETAILS') p.open = true;
        p = p.parentElement;
      }
      try { el.scrollIntoView({ behavior: 'smooth', block: 'center' }); } catch (e) { el.scrollIntoView(true); }
      el.classList.remove('du-flash');
      void el.offsetWidth;
      el.classList.add('du-flash');
      setTimeout(() => el.classList.remove('du-flash'), 1800);
    }, 80);
  }
  function register(b) {
    if (!b || !b.id || !b.ver) return;
    extra[b.id] = b;

    try { afterRender(); } catch (e) {}
  }
  function unregister(id) {
    delete extra[id];
    try { afterRender(); } catch (e) {}
  }
  return { afterRender, register, unregister, jump, unseen, boot, stateOf, catalog, tabCount, paintTabBadges, isVisible, LS };
})();
